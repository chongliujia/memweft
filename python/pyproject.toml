[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "memweft"
version = "0.2.0a1"
description = "Python SDK for the MemWeft memory system"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MemWeft" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<2"]

[tool.maturin]
python-source = "src"
module-name = "memweft._core"
bindings = "pyo3"
manifest-path = "../crates/memweft-ffi/Cargo.toml"
exclude = ["**/__pycache__/**", "**/*.pyc"]
