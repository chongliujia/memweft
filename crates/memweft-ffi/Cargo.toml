[package]
name = "memweft-ffi"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
memweft = { path = "../memweft" }
chrono = { version = "0.4", features = ["serde"] }
memweft-store = { path = "../memweft-store" }
memweft-types = { path = "../memweft-types" }
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
pyo3-log = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
mysql = ["memweft-store/mysql"]
postgres = ["memweft-store/postgres"]
