name: Build and verify native SDKs
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: cargo test --locked
      - run: python -m pip install maturin -r python/requirements-test.txt
      - name: Build Python wheel
        working-directory: python
        run: maturin build --release --locked --out ../dist
      - name: Install wheel
        shell: python
        run: |
          import glob, subprocess, sys
          wheel = glob.glob('dist/*.whl')[0]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel])
      - run: python -m unittest discover -s python/tests -v
      - run: npm ci
        working-directory: typescript
      - run: npm run build:native
        working-directory: typescript
      - run: npm run build
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm pack --pack-destination ../dist
        working-directory: typescript
      - run: cargo build --release --locked -p memweft --bin memweft
      - uses: actions/upload-artifact@v4
        with:
          name: memweft-${{ matrix.os }}
          path: |
            dist/*
            target/release/memweft
            target/release/memweft.exe
